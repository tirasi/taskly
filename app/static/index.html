<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taskly</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<aside id="side" aria-label="Navigation"></aside>

<main>
  <div class="wrap">
    <header class="page-head"><h1 id="viewTitle">Today</h1><span id="viewSub"></span></header>

    <form id="addForm" autocomplete="off">
      <input id="addInput" type="text" maxlength="500" aria-label="Add a task"
             placeholder="Add a task… e.g. gym every mon 6am #Health">
      <button type="button" id="micBtn" class="mic" aria-label="Speak a command" title="Speak a command"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg></button>
      <button class="primary">Add</button>
    </form>
    <div id="preview" class="preview" aria-live="polite"></div>

    <div id="list"></div>
  </div>
</main>

<section id="drawer" aria-label="Task details" hidden></section>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="/app.js" defer></script>
</body>
</html>
